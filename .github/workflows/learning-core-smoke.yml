name: Learning Core Smoke Test

on:
  push:
    branches: [smoke-learning-core-20261001]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx --yes tsx scripts/smoke-learning-core.ts
