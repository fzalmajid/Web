name: Bootstrap Ruang Belajar

on:
  push:
    paths:
      - source.b64
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack application source
        shell: bash
        run: |
          base64 -d source.b64 | tar -xzf -
          rm -f source.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes."
            exit 0
          fi
          git commit -m "Bootstrap Ruang Belajar application"
          git push
